[project]
name = "ocots-lint"
version = "0.4.1"
description = "Vérifie les conventions de rédaction ocots-conventions sur des sources LaTeX."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pylatexenc>=2.10,<3"]

[project.scripts]
ocots-lint = "ocots_lint.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocots_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 88
extend-exclude = ["conventions"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# Les règles portent des noms de règle (P2, C4…) : majuscules voulues.
ignore = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["ocots_lint"]
known-local-folder = ["outils"]
