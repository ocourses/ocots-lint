name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # conventions (parité), template (vocabulaire)
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python ${{ matrix.python }} pytest -ra

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check

  verifier-pr:
    # Le workflow réutilisable, sur ce dépôt même : teste sa mécanique
    # (référence git, uv, annotations). Périmètre sans .tex.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/verifier-pr.yml
    with:
      commande: uv run ocots-lint verifier
      chemins: src
